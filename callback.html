<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charter Uploader — код авторизации</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 720px; margin: 0 auto; padding: 48px 20px;
         font: 16px/1.65 -apple-system, "Segoe UI", Roboto, sans-serif;
         color: #1a1a1a; background: #fff; }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8e8; background: #16181c; }
    .code { background: #23262c; border-color: #343941; }
    button { background: #e83e3e; }
  }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .lead { color: #777; margin-top: 0; }
  .code { border: 1px solid #e0e0e0; background: #f7f7f8; border-radius: 10px;
          padding: 16px 18px; font-family: Consolas, monospace; font-size: 15px;
          word-break: break-all; margin: 20px 0 12px; }
  button { background: #e83e3e; color: #fff; border: 0; border-radius: 8px;
           padding: 11px 20px; font-size: 15px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .hint { font-size: 14px; color: #888; margin-top: 22px; }
  .err { color: #d33; }
</style>
</head>
<body>

<h1>Код авторизации</h1>
<p class="lead">Скопируй его и вставь в терминал, где ждёт <code>auth.py</code>.</p>

<div id="box"></div>

<p class="hint">Страница ничего никуда не отправляет: код просто извлекается из адреса
в твоём браузере. Закрывать можно сразу после копирования.</p>

<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error');
  const box = document.getElementById('box');

  if (code) {
    const pre = document.createElement('div');
    pre.className = 'code';
    pre.textContent = code;
    const btn = document.createElement('button');
    btn.textContent = 'Копировать код';
    btn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(code);
        btn.textContent = 'Скопировано ✓';
      } catch (e) {
        const r = document.createRange();
        r.selectNodeContents(pre);
        getSelection().removeAllRanges();
        getSelection().addRange(r);
        btn.textContent = 'Выделено — нажми Ctrl+C';
      }
    };
    box.append(pre, btn);
  } else if (error) {
    box.innerHTML = '<p class="err">TikTok вернул ошибку: <b></b></p>';
    box.querySelector('b').textContent =
      error + (params.get('error_description') ? ' — ' + params.get('error_description') : '');
  } else {
    box.innerHTML = '<p class="err">В адресе нет параметра <code>code</code>. ' +
      'Похоже, страница открыта напрямую, а не после входа в TikTok.</p>';
  }
</script>

</body>
</html>
